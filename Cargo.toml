[package]
name = "minecraft-logs-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small native desktop workspace for Minecraft logs"
license = "MIT"

[dependencies]
fltk = { version = "=1.5.23", features = ["no-images"] }
compress-tools = { version = "=0.16.1", default-features = false, features = ["static", "static_z", "static_lzma", "static_bz2"] }
regex = "=1.13.1"
encoding_rs = "=0.8.35"
chardetng = "=0.1.17"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
